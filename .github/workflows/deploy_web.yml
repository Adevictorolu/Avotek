name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: avotek/avotek_flutter
        run: flutter pub get

      - name: Validate Supabase web configuration
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Set the SUPABASE_URL and SUPABASE_ANON_KEY repository variables to the intended Supabase project before deploying."
            exit 1
          fi

      - name: Build Web Release
        working-directory: avotek/avotek_flutter
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          flutter build web --release \
            --pwa-strategy=none \
            --base-href "/${{ github.event.repository.name }}/" \
            --dart-define="SUPABASE_URL=$SUPABASE_URL" \
            --dart-define="SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: avotek/avotek_flutter/build/web

      - name: Cancel stale Pages deployment
        uses: actions/github-script@v7
        env:
          PREVIOUS_COMMIT: ${{ github.event.before }}
        with:
          script: |
            const deploymentId = process.env.PREVIOUS_COMMIT
            if (!deploymentId || /^0+$/.test(deploymentId)) {
              return
            }

            const request = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deploymentId
            }

            try {
              const { data } = await github.request(
                'GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}',
                request
              )
              if (!['deployed', 'errored', 'deployment_cancelled'].includes(data.status)) {
                core.info(`Canceling stale Pages deployment ${deploymentId} (${data.status}).`)
                await github.request(
                  'POST /repos/{owner}/{repo}/pages/deployments/{deployment_id}/cancel',
                  request
                )
              }
            } catch (error) {
              if (error.status === 404) {
                core.info(`No previous Pages deployment exists for ${deploymentId}.`)
                return
              }
              throw error
            }

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

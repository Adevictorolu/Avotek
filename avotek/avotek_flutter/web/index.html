<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <!-- GitHub Pages SPA redirect decoder -->
  <script type="text/javascript">
    (function(l) {
      if (l.search[1] === '/' ) {
        var decoded = l.search.slice(1).split('&').map(function(s) { 
          return s.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Avotek — Instant Nigerian VTU, Cheap SME & Gifting Data, Airtime, Electricity Tokens, and Cable TV">
  <meta name="google-signin-client_id" content="499643353122-su0u941trtlk3e4c5f7o8abiih7q52r8.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Avotek">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Avotek — Instant Data, Airtime & Bill Payments</title>
  <link rel="manifest" href="manifest.json">

  <!-- Plus Jakarta Sans Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0A0E17;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }
    #loading-indicator {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #111827 0%, #0B101D 100%);
      z-index: 999999;
      transition: opacity 0.5s ease-out;
    }
    .logo-progress-wrapper {
      position: relative;
      width: 96px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .progress-ring {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 3.5px solid rgba(0, 210, 255, 0.15);
      border-top-color: #00D2FF;
      border-right-color: #0052FF;
      border-radius: 50%;
      animation: spin 1s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
    }
    .logo-frame {
      width: 62px;
      height: 62px;
      border-radius: 18px;
      background: #131B2E;
      border: 1.5px solid #23304B;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 24px rgba(0, 82, 255, 0.25);
    }
    .logo-frame img {
      width: 42px;
      height: 42px;
      object-fit: contain;
      border-radius: 12px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-indicator">
    <div class="logo-progress-wrapper">
      <div class="progress-ring"></div>
      <div class="logo-frame">
        <img src="assets/images/logo.png" onerror="this.src='favicon.png'" alt="Avotek Logo" />
      </div>
    </div>
  </div>

  <script>
    function removeLoader() {
      var loader = document.getElementById('loading-indicator');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() {
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 400);
      }
    }
    window.addEventListener('flutter-first-frame', removeLoader);
    // Fallback: hide loader after 3 seconds in case event already passed or took too long
    setTimeout(removeLoader, 3000);
  </script>
  <!-- Google Identity Services (GIS) for Authentic Google OAuth -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    window.avotekGoogleSignIn = function(callback) {
      if (typeof google !== 'undefined' && google.accounts && google.accounts.id) {
        google.accounts.id.initialize({
          client_id: '499643353122-su0u941trtlk3e4c5f7o8abiih7q52r8.apps.googleusercontent.com',
          auto_select: false,
          cancel_on_tap_outside: false,
          callback: function(response) {
            try {
              var base64Url = response.credential.split('.')[1];
              var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
              var jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
              }).join(''));
              var payload = JSON.parse(jsonPayload);
              window.dispatchEvent(new CustomEvent('avotek_google_auth', { detail: payload }));
              if (callback) callback(payload);
            } catch(e) {
              console.error('Google token parse error:', e);
            }
          }
        });
        google.accounts.id.prompt(function(notification) {
          if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
            // Fallback to standard Google OAuth popup/redirect if One Tap is suppressed
            var authUrl = 'https://accounts.google.com/o/oauth2/v2/auth?' +
              'client_id=499643353122-su0u941trtlk3e4c5f7o8abiih7q52r8.apps.googleusercontent.com' +
              '&response_type=token' +
              '&scope=email%20profile%20openid' +
              '&redirect_uri=' + encodeURIComponent(window.location.origin);
            var popup = window.open(authUrl, 'GoogleSignIn', 'width=500,height=600');
          }
        });
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <!-- GitHub Pages SPA redirect decoder & stale Service Worker cleanup -->
  <script type="text/javascript">
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (var i = 0; i < names.length; i++) {
          if (names[i].indexOf('flutter-app-manifest') !== -1 || names[i].indexOf('flutter-temp-cache') !== -1) {
            caches.delete(names[i]);
          }
        }
      });
    }
    (function(l) {
      if (l.search[1] === '/' ) {
        var decoded = l.search.slice(1).split('&').map(function(s) { 
          return s.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Avotek — Instant Nigerian VTU, Cheap SME & Gifting Data, Airtime, Electricity Tokens, and Cable TV">
  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Avotek">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Avotek — Instant Data, Airtime & Bill Payments</title>
  <link rel="manifest" href="manifest.json">

  <link rel="preload" href="assets/assets/fonts/Figtree-Variable.ttf" as="font" type="font/ttf" crossorigin>

  <style>
    @font-face {
      font-family: 'Figtree';
      src: url('assets/assets/fonts/Figtree-Variable.ttf') format('truetype');
      font-weight: 100 900;
      font-display: swap;
    }
    html, body, flt-glass-pane, flt-scene-host, * {
      font-family: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
    }
    input, textarea, select, button {
      font-family: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
    }
    ::placeholder,
    input::placeholder,
    textarea::placeholder,
    ::-webkit-input-placeholder,
    :-moz-placeholder,
    ::-moz-placeholder,
    :-ms-input-placeholder {
      font-family: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #0A0E17;
      overflow: hidden;
    }
    #loading-indicator {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #111827 0%, #0B101D 100%);
      z-index: 999999;
      transition: opacity 0.5s ease-out;
    }
    .logo-progress-wrapper {
      position: relative;
      width: 96px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .progress-ring {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 3.5px solid rgba(0, 210, 255, 0.15);
      border-top-color: #00D2FF;
      border-right-color: #0052FF;
      border-radius: 50%;
      animation: spin 1s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
    }
    .logo-frame {
      width: 62px;
      height: 62px;
      border-radius: 18px;
      background: #131B2E;
      border: 1.5px solid #23304B;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 24px rgba(0, 82, 255, 0.25);
    }
    .logo-frame img {
      width: 42px;
      height: 42px;
      object-fit: contain;
      border-radius: 12px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-indicator">
    <div class="logo-progress-wrapper">
      <div class="progress-ring"></div>
      <div class="logo-frame">
        <img src="assets/assets/images/logo.png" onerror="this.src='favicon.png'" alt="Avotek Logo" />
      </div>
    </div>
  </div>

  <script>
    function removeLoader() {
      var loader = document.getElementById('loading-indicator');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() {
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 400);
      }
    }
    window.addEventListener('flutter-first-frame', removeLoader);
    // Fallback: hide loader after 3 seconds in case event already passed or took too long
    setTimeout(removeLoader, 3000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

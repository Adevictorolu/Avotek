services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: avotek
      POSTGRES_PASSWORD: "3BGHsr37iSVMSZKJeZfkzBR-n821MdA-"
    volumes:
      - avotek_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "CTgJXxagnq5D5AZNiOna9TMCto7Y5Sxi"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: avotek_test
      POSTGRES_PASSWORD: "LLN2FyXjbhu3YcFbH74bwWhfUQVp8tHa"
    volumes:
      - avotek_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "65q7LBc8ntOkyK0hdNVnTqgbDBUP-JBy"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  avotek_data:
  avotek_test_data:
